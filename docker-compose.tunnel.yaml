name: dokploy
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: dokploy/dokploy:latest
    container_name: dokploy-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dokploy-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SKIP_TRAEFIK: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/trpc/settings.health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/dokploy:/var/lib/dokploy/application:z'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://dokploy-app:3000'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - dokploy
      - cloudflare


networks:
  dokploy:
    name: dokploy
    external: false
  cloudflare:
    external: true
