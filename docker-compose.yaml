# nginx proxy address - http://172.17.0.1:64157

name: dokploy
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: dokploy/dokploy:latest
    container_name: dokploy-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: dokploy-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SKIP_TRAEFIK: 'true'
    ports:
      - '172.17.0.1:64157:3000'
    volumes:
      - './volumes/data/dokploy:/var/lib/dokploy/application:z'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    networks:
      - dokploy

networks:
  dokploy:
    name: dokploy
    external: false
